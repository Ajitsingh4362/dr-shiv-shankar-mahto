<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0f2138"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="600" height="520" fill="url(#bgGlow)"/>

  <!-- soft dot grid corner -->
  <g opacity="0.35">
    <circle cx="60" cy="60" r="2" fill="#99f6e4"/>
    <circle cx="90" cy="60" r="2" fill="#99f6e4"/>
    <circle cx="120" cy="60" r="2" fill="#99f6e4"/>
    <circle cx="60" cy="90" r="2" fill="#99f6e4"/>
    <circle cx="90" cy="90" r="2" fill="#99f6e4"/>
    <circle cx="60" cy="120" r="2" fill="#99f6e4"/>
  </g>

  <!-- outer rings -->
  <circle cx="300" cy="260" r="200" fill="none" stroke="#14b8a6" stroke-opacity="0.12"/>
  <circle cx="300" cy="260" r="150" fill="none" stroke="#14b8a6" stroke-opacity="0.18"/>

  <!-- main badge -->
  <circle cx="300" cy="260" r="115" fill="#0d9488" fill-opacity="0.14" stroke="url(#ringGrad)" stroke-width="2"/>

  <!-- medical cross -->
  <g transform="translate(300,232)">
    <rect x="-14" y="-46" width="28" height="92" rx="6" fill="#5eead4"/>
    <rect x="-46" y="-14" width="92" height="28" rx="6" fill="#5eead4"/>
  </g>

  <!-- pulse line beneath -->
  <path d="M120,360 H230 L250,330 L270,390 L290,345 L305,360 H480" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- orbit dots -->
  <circle cx="150" cy="150" r="6" fill="#0d9488"/>
  <circle cx="460" cy="180" r="5" fill="#14b8a6"/>
  <circle cx="440" cy="380" r="4" fill="#5eead4"/>
  <circle cx="130" cy="380" r="4" fill="#0d9488"/>

  <!-- caption chip -->
  <g transform="translate(190,432)">
    <rect width="220" height="46" rx="8" fill="#0f2138" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="110" y="20" text-anchor="middle" font-family="Jost, sans-serif" font-size="11" letter-spacing="1.5" fill="#5eead4" font-weight="600">GENERAL PHYSICIAN</text>
    <text x="110" y="35" text-anchor="middle" font-family="Jost, sans-serif" font-size="10" fill="#9fb3c8">Consultation &amp; Care</text>
  </g>
</svg>
