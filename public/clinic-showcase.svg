<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f2"/>
      <stop offset="100%" stop-color="#dcece8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9d8de"/>
      <stop offset="100%" stop-color="#b3c6cd"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" fill="url(#wallGrad)"/>
  <rect y="560" width="1400" height="240" fill="url(#floorGrad)"/>
  <rect y="555" width="1400" height="8" fill="#0f2138" opacity="0.15"/>

  <!-- window -->
  <g>
    <rect x="90" y="90" width="260" height="330" rx="6" fill="#f7f9fa" stroke="#0f2138" stroke-opacity="0.15" stroke-width="4"/>
    <rect x="90" y="90" width="260" height="330" fill="#bfe3df" opacity="0.5"/>
    <line x1="220" y1="90" x2="220" y2="420" stroke="#0f2138" stroke-opacity="0.15" stroke-width="4"/>
    <line x1="90" y1="255" x2="350" y2="255" stroke="#0f2138" stroke-opacity="0.15" stroke-width="4"/>
  </g>

  <!-- framed cross emblem on wall -->
  <g transform="translate(700,120)">
    <rect x="-90" y="-60" width="180" height="150" rx="8" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.5" stroke-width="4"/>
    <rect x="-18" y="-25" width="36" height="80" rx="8" fill="#0d9488"/>
    <rect x="-40" y="-3" width="80" height="36" rx="8" fill="#0d9488"/>
  </g>

  <!-- clock -->
  <g transform="translate(1140,150)">
    <circle r="46" fill="#ffffff" stroke="#0f2138" stroke-opacity="0.25" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#0f2138" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="8" stroke="#0f2138" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#0d9488"/>
  </g>

  <!-- reception desk -->
  <g>
    <rect x="520" y="470" width="420" height="110" rx="10" fill="#0f2138"/>
    <rect x="520" y="470" width="420" height="14" rx="6" fill="#16324f"/>
    <rect x="560" y="500" width="90" height="50" rx="6" fill="#14b8a6" opacity="0.85"/>
    <text x="605" y="530" text-anchor="middle" font-family="Jost, sans-serif" font-size="15" font-weight="700" fill="#0f2138">MAHTO</text>
    <rect x="700" y="500" width="200" height="8" rx="4" fill="#5eead4" opacity="0.6"/>
    <rect x="700" y="518" width="140" height="6" rx="3" fill="#5eead4" opacity="0.35"/>
  </g>

  <!-- potted plant left -->
  <g transform="translate(430,540)">
    <rect x="-28" y="30" width="56" height="60" rx="8" fill="#0f2138" opacity="0.85"/>
    <path d="M0,30 C-40,10 -50,-40 -10,-60 C10,-80 40,-60 30,-30 C50,-40 60,0 20,15 C30,40 -10,45 0,30 Z" fill="#0d9488"/>
  </g>

  <!-- potted plant right -->
  <g transform="translate(990,545)">
    <rect x="-24" y="26" width="48" height="52" rx="8" fill="#0f2138" opacity="0.85"/>
    <path d="M0,26 C-34,8 -42,-34 -8,-52 C10,-68 34,-50 26,-26 C42,-34 50,2 16,12 C26,34 -8,38 0,26 Z" fill="#14b8a6"/>
  </g>

  <!-- waiting chairs -->
  <g transform="translate(140,610)">
    <rect x="0" y="0" width="220" height="18" rx="6" fill="#0f2138" opacity="0.9"/>
    <rect x="0" y="-46" width="18" height="64" rx="6" fill="#0f2138" opacity="0.9"/>
    <rect x="70" y="-46" width="18" height="64" rx="6" fill="#0f2138" opacity="0.9"/>
    <rect x="140" y="-46" width="18" height="64" rx="6" fill="#0f2138" opacity="0.9"/>
    <rect x="202" y="-46" width="18" height="64" rx="6" fill="#0f2138" opacity="0.9"/>
    <rect x="0" y="-58" width="220" height="16" rx="6" fill="#0d9488" opacity="0.85"/>
  </g>

  <!-- floor line accent -->
  <path d="M0,700 Q700,660 1400,700" fill="none" stroke="#0d9488" stroke-opacity="0.25" stroke-width="6"/>

  <!-- caption plate -->
  <g transform="translate(1030,700)">
    <rect width="330" height="64" rx="10" fill="#0f2138"/>
    <text x="20" y="27" font-family="Jost, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5eead4">MAHTO CLINIC</text>
    <text x="20" y="47" font-family="Jost, sans-serif" font-size="12" fill="#cfe3df">Dr. Shiv Shankar Mahto · Sitamarhi</text>
  </g>
</svg>
